# Minden pushnál: adatellenőrzés, a generált fájlok egyeznek-e a forrással, böngészős ellenőrzés Chromiumban és Firefoxban.
name: Ellenőrzés
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  ellenorzes:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Playwright telepítése
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium firefox
      - name: Adatellenőrzés (ADATOK blokk)
        run: node tools/adatellenorzes.js tools/forras/index.html
      - name: A generált fájlok egyeznek a forrással
        run: |
          mkdir -p /tmp/gen/tools
          python3 tools/artifact2gh.py tools/forras/index.html /tmp/gen
          diff -q /tmp/gen/index.html index.html
          diff -q /tmp/gen/radar.css radar.css
          diff -q /tmp/gen/radar.js radar.js
          echo "A kézzel szerkesztett index.html/radar.css/radar.js itt bukna el."
      - name: Böngészős ellenőrzés (Chromium, Firefox; 1360 és 390 px)
        run: python3 tools/ellenorzes.py --firefox
